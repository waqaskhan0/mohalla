name: Android

# Builds the Android application and runs the JVM-side localization and RTL
# checks. No emulator: emulator jobs need nested virtualization and are slow,
# and the checks that matter here - string parity and supportsRtl - are
# verifiable on the JVM.
#
# On-device RTL verification remains a manual gate before release. It is NOT
# claimed to be covered by this workflow.

# NO PATH FILTER, DELIBERATELY, AND IT COSTS ABOUT THREE AND A HALF MINUTES.
#
# `Assemble debug and test` is a REQUIRED status check on `main`. A required
# check that is path-filtered never reports on a pull request outside those
# paths, and GitHub does not treat "did not run" as "passed" - it waits for it
# forever. So a documentation-only pull request became permanently unmergeable
# except by administrator override, which is exactly the protection being
# bypassed. PR #18 found this; every pull request before it happened to touch
# `apps/android/**`, so nothing revealed it.
#
# The alternatives were worse. Dropping the check from the required list
# weakens the gate for the changes that actually need it. Adding a second
# workflow that reports the same check name as a no-op teaches the branch
# protection to accept a green tick that tested nothing.
#
# Running it always is the honest option: the check reports on every pull
# request, and it reports the truth.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (public repo): the default token is read-only for every job.
# No job here needs write access - CI only builds and tests. A job that ever
# needs more must request it explicitly at the JOB level, never here.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Least privilege at the JOB level: this job only reads the repo.
    permissions:
      contents: read
    name: Assemble debug and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/android

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localization parity and supportsRtl
        run: ./gradlew test --no-daemon --console=plain

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: mohalla-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
