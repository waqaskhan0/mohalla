name: CI

# Every gate that can run without a device runs here, on every push and PR.
#
# The guards are jobs, not optional steps. An architecture rule that only fails
# in review is a rule that gets broken under delivery pressure - and OD-011
# commits 68 working days, which is exactly the pressure that erodes them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (public repo): the default token is read-only for every job.
# No job here needs write access - CI only builds and tests. A job that ever
# needs more must request it explicitly at the JOB level, never here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.20.0'

jobs:
  # ---------------------------------------------------------------- guards
  guards:
    # Least privilege at the JOB level: this job only reads the repo.
    permissions:
      contents: read
    name: Architecture and safety guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan sees what is actually tracked.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Module dependency direction (admin -> product -> platform)
        run: node scripts/posix/check-module-dependencies.mjs

      - name: Localization parity (every en key has an ur key)
        run: node scripts/posix/check-locale-parity.mjs

      - name: Secret scan (tracked files)
        run: node scripts/posix/check-secrets.mjs

  # ------------------------------------------------------------ node build
  node:
    # Least privilege at the JOB level: this job only reads the repo.
    permissions:
      contents: read
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint (includes the RTL gate)
        run: npm run lint

      - name: Build all workspaces
        run: npm run build

      - name: Unit tests (api, worker, validation, admin)
        run: npm run test --workspaces --if-present

      - name: OpenAPI document generates without booting a server
        env:
          # Never touched — the spec is built from decorators, not from a live DB.
          DATABASE_URL: postgres://unused:unused@127.0.0.1:5432/unused
          OPENAPI_OUT: openapi.generated.json
        run: |
          node apps/api/dist/main.js &
          API_PID=$!
          sleep 4
          kill $API_PID 2>/dev/null || true
          test -f openapi.generated.json && echo "OpenAPI generated" || (echo "OpenAPI NOT generated" && exit 1)

  # -------------------------------------------------------------- database
  database:
    # Least privilege at the JOB level: this job only reads the repo.
    permissions:
      contents: read
    name: Migrations, roles, audit immutability
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mohalla
          POSTGRES_USER: mohalla_owner
          POSTGRES_PASSWORD: ci_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mohalla_owner -d mohalla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ADMIN_DATABASE_URL: postgres://mohalla_owner:ci_local_only@127.0.0.1:5432/mohalla
      DATABASE_NAME: mohalla
      # CI-only role passwords. These never leave the runner and are not used
      # by any deployed environment.
      ROLE_MIGRATION_OWNER_PASSWORD: ci_migration_owner
      ROLE_RUNTIME_APP_PASSWORD: ci_runtime_app
      ROLE_RUNTIME_WORKER_PASSWORD: ci_runtime_worker
      ROLE_READ_ONLY_SUPPORT_PASSWORD: ci_read_only_support

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Create the four database roles
        run: npm run db:roles

      - name: Run migrations
        env:
          # MIGRATION_DATABASE_URL, not DATABASE_URL. `node-pg-migrate` used to
          # fall back to DATABASE_URL, so this step handed it a migration_owner
          # connection under a name that means runtime_app everywhere else —
          # and runtime_app has USAGE on `public` but not CREATE, so the
          # ambiguity was one env var away from a confusing failure. The
          # migrate scripts now name the variable they need (`-d
          # MIGRATION_DATABASE_URL`), which is what the two steps below were
          # already doing.
          MIGRATION_DATABASE_URL: postgres://migration_owner:ci_migration_owner@127.0.0.1:5432/mohalla
        run: npm run db:migrate

      - name: Migration status must be clean
        env:
          MIGRATION_DATABASE_URL: postgres://migration_owner:ci_migration_owner@127.0.0.1:5432/mohalla
        run: npm run db:migrate:status

      - name: Audit immutability and role privileges enforced by PostgreSQL
        env:
          RUNTIME_APP_DATABASE_URL: postgres://runtime_app:ci_runtime_app@127.0.0.1:5432/mohalla
          READ_ONLY_SUPPORT_DATABASE_URL: postgres://read_only_support:ci_read_only_support@127.0.0.1:5432/mohalla
          MIGRATION_DATABASE_URL: postgres://migration_owner:ci_migration_owner@127.0.0.1:5432/mohalla
        run: npm run test --workspace @mohalla/db

      - name: Build the worker (needed to run the queue round-trip)
        run: npm run build --workspace @mohalla/worker

      - name: Install the pg-boss schema as migration_owner (DDL — runtime roles cannot)
        env:
          DATABASE_URL: postgres://migration_owner:ci_migration_owner@127.0.0.1:5432/mohalla
        run: npm run queue:install --workspace @mohalla/worker

      - name: FOUNDATION_HEALTH_JOB round-trips through pg-boss
        env:
          # The worker runs as runtime_worker (DML only). The schema already
          # exists from the install step above, so no DDL is attempted here -
          # which is exactly the privilege boundary being verified.
          WORKER_DATABASE_URL: postgres://runtime_worker:ci_runtime_worker@127.0.0.1:5432/mohalla
          ENQUEUE_DATABASE_URL: postgres://runtime_app:ci_runtime_app@127.0.0.1:5432/mohalla
          PGPASSWORD: ci_migration_owner
        run: |
          set -euo pipefail
          DATABASE_URL="$WORKER_DATABASE_URL" node apps/worker/dist/main.js &
          WORKER_PID=$!
          sleep 4
          DATABASE_URL="$ENQUEUE_DATABASE_URL" node apps/worker/dist/enqueue-health.js ci-smoke
          # Poll for terminal state rather than assuming a fixed sleep is enough.
          STATE=""
          for i in $(seq 1 20); do
            STATE=$(psql -h 127.0.0.1 -U migration_owner -d mohalla -tAc               "select state from pgboss.job where name='foundation.health' and data->>'marker'='ci-smoke' order by created_on desc limit 1" | tr -d '[:space:]')
            if [ "$STATE" = "completed" ]; then break; fi
            sleep 2
          done
          kill $WORKER_PID 2>/dev/null || true
          echo "final job state: $STATE"
          test "$STATE" = "completed"

  # -------------------------------------------------------------- security
  security:
    # Least privilege at the JOB level: this job only reads the repo.
    permissions:
      contents: read
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Secret scan (tracked files)
        run: node scripts/posix/check-secrets.mjs

      - name: Dependency audit (high and critical fail the build)
        # A moderate advisory is reported but does not block a two-person team on
        # every transitive bump; high/critical do. `npm audit` reads the committed
        # lockfile, so this is deterministic.
        run: npm audit --audit-level=high
